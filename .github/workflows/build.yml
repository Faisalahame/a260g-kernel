name: Build A260G Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu

      - name: Show compiler
        run: |
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-ld --version

      - name: Prepare config
        run: |
          mkdir -p out
          cp a260g_stock_defconfig out/.config
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          make -j2 V=1 \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -Wno-error=attribute-alias -Wno-error=stringop-overread -Wno-error=stringop-truncation -Wno-error=misleading-indentation -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=strict-prototypes -Wno-error=date-time"

      - name: Check output
        if: always()
        run: |
          echo "=== Kernel output ==="
          find out/arch/arm64/boot -maxdepth 2 -type f -ls || true

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: a260g-kernel-test
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb*
            out/arch/arm64/boot/*.dtb
            out/arch/arm64/boot/*.gz
          if-no-files-found: warn
