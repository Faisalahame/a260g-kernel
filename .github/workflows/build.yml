name: Build A260G Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            git

      - name: Install Android GCC 4.9
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain
          ls toolchain/bin

      - name: Prepare config
        run: |
          mkdir out
          cp a260g_stock_defconfig out/.config
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=$CROSS_COMPILE

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: a260g-kernel-test
          path: out/arch/arm64/boot/
